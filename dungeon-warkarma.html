<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>GLB Viewer</title>
    <meta
      name="description"
      content="Um visualizador GLB simples e elegante construído com Preact e Three.js"
    />
    <link rel="icon" href="data:," />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Styling -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Import Map -->
    <script type="importmap">
      {
        "imports": {
          "preact": "https://esm.sh/preact@10.19.2",
          "preact/hooks": "https://esm.sh/preact@10.19.2/hooks",
          "htm/preact": "https://esm.sh/htm@3.1.1/preact",
          "three": "https://esm.sh/three@0.160.0",
          "three/examples/jsm/controls/OrbitControls": "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js",
          "three/examples/jsm/loaders/GLTFLoader": "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
          "three/examples/jsm/loaders/DRACOLoader": "https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js",
          "three/examples/jsm/loaders/KTX2Loader": "https://esm.sh/three@0.160.0/examples/jsm/loaders/KTX2Loader.js",
          "three/examples/jsm/environments/RoomEnvironment": "https://esm.sh/three@0.160.0/examples/jsm/environments/RoomEnvironment.js",
          "three/examples/jsm/libs/stats.module": "https://esm.sh/three@0.160.0/examples/jsm/libs/stats.module.js",
          "meshoptimizer": "https://esm.sh/meshoptimizer@0.21.0"
        }
      }
    </script>

    <script type="module">
      import { h, render } from "preact";
      import { useEffect, useRef, useState } from "preact/hooks";
      import { html } from "htm/preact";
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls";
      import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader";
      import { DRACOLoader } from "three/examples/jsm/loaders/DRACOLoader";
      import { KTX2Loader } from "three/examples/jsm/loaders/KTX2Loader";
      import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment";
      import Stats from "three/examples/jsm/libs/stats.module";
      import { MeshoptDecoder } from "meshoptimizer";

      function App() {
        const mountRef = useRef(null);

        // Helper to send messages to React Native
        const sendMessageToRN = (type, data = {}) => {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(
              JSON.stringify({ type, ...data }),
            );
          }
        };

        const [isLoading, setIsLoading] = useState(false);
        const [isDragging, setIsDragging] = useState(false);
        const [meshes, setMeshes] = useState([]);
        const [filename, setFilename] = useState("");
        const [showGrid, setShowGrid] = useState(true);
        const [showMeshList, setShowMeshList] = useState(true);
        const [focusedInfo, setFocusedInfo] = useState(null);
        const [showStats, setShowStats] = useState(false);
        const [perfStats, setPerfStats] = useState({
          fps: 0,
          avgFps: 0,
          minFps: 60,
          frameTime: 0,
          memory: { used: 0 },
          network: {
            totalMB: 0,
            files: 0,
            modelSizeMB: 0,
            modelTime: 0,
            isCached: false,
          },
          gpu: {
            name: "Carregando...",
            drawCalls: 0,
            triangles: 0,
            textures: 0,
            geometries: 0,
          },
          loadTime: 0,
          modelSize: { vertices: 0, faces: 0 },
        });

        // Tracking refs for performance
        const perfTrackingRef = useRef({
          frames: 0,
          lastTime: performance.now(),
          fpsHistory: [],
          frameTimeHistory: [],
          lastFrameTime: performance.now(),
          startTime: performance.now(),
        });

        // Scene refs
        const sceneRef = useRef(null);
        const rendererRef = useRef(null);
        const cameraRef = useRef(null);
        const modelRef = useRef(null);
        const controlsRef = useRef(null);

        useEffect(() => {
          // Theme Detection
          const getThemeColors = () => {
            const isLight = window.matchMedia(
              "(prefers-color-scheme: light)",
            ).matches;
            return {
              bg: isLight ? 0xf8fafc : 0x0f1115,
              grid1: isLight ? 0xcbd5e1 : 0x334155,
              grid2: isLight ? 0xe2e8f0 : 0x1e293b,
            };
          };

          const theme = getThemeColors();

          // Setup Three.js
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(theme.bg);
          sceneRef.current = scene;

          const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.01,
            5000,
          );
          camera.position.set(5, 5, 5);
          cameraRef.current = camera;

          const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            logarithmicDepthBuffer: true,
          });
          renderer.setSize(window.innerWidth, window.innerHeight);

          // Optimization: cap pixel ratio on mobile to 2.0 (often default 3.0+ is overkill for performance)
          const pixelRatio = Math.min(window.devicePixelRatio, 2);
          renderer.setPixelRatio(pixelRatio);

          // Color Management
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 0.8;

          mountRef.current.appendChild(renderer.domElement);
          rendererRef.current = renderer;

          // Environment (Crucial for PBR materials/colors)
          const pmremGenerator = new THREE.PMREMGenerator(renderer);
          scene.environment = pmremGenerator.fromScene(
            new RoomEnvironment(renderer),
            0.04,
          ).texture;

          // Lights
          const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
          scene.add(ambientLight);

          const directLight = new THREE.DirectionalLight(0xffffff, 1.0);
          directLight.position.set(5, 10, 7.5);
          scene.add(directLight);

          const hemisphereLight = new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            1.0,
          );
          scene.add(hemisphereLight);

          // Grid Floor
          let grid = new THREE.GridHelper(
            20,
            20,
            theme.grid1,
            theme.grid2,
          );
          grid.visible = showGrid;
          scene.add(grid);

          // Theme Listener
          const mediaQuery = window.matchMedia(
            "(prefers-color-scheme: light)",
          );
          const handleThemeChange = (e) => {
            const isLight = e.matches;
            const newColors = {
              bg: isLight ? 0xf8fafc : 0x0f1115,
              grid1: isLight ? 0xcbd5e1 : 0x334155,
              grid2: isLight ? 0xe2e8f0 : 0x1e293b,
            };

            scene.background.set(newColors.bg);

            // Replace grid
            scene.remove(grid);
            grid = new THREE.GridHelper(
              20,
              20,
              newColors.grid1,
              newColors.grid2,
            );
            grid.visible = showGrid;
            scene.add(grid);
          };
          mediaQuery.addEventListener("change", handleThemeChange);

          // Orbit Controls
          const controls = new OrbitControls(
            camera,
            renderer.domElement,
          );
          controls.enableDamping = true;
          controls.dampingFactor = 0.08; // slightly higher for snappier feel
          controls.rotateSpeed = 0.8;
          controls.touchRotateSpeed = 1.0;
          controls.zoomSpeed = 1.2;
          controlsRef.current = controls;

          // Expose helper to change grid visibility from outside
          window._toggleGrid = (val) => {
            if (grid) grid.visible = val;
          };

          // Resize handler
          const handleResize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          };
          window.addEventListener("resize", handleResize);

          // Raycaster for clicking objects
          const raycaster = new THREE.Raycaster();
          const mouse = new THREE.Vector2();

          // Robust click detection
          let mouseDownTime = 0;
          const mouseDownPos = new THREE.Vector2();

          const handleMouseDown = (e) => {
            mouseDownTime = Date.now();
            mouseDownPos.set(e.clientX, e.clientY);
          };

          const handleMouseUp = (e) => {
            const clickDuration = Date.now() - mouseDownTime;
            const moveDistance = Math.hypot(
              e.clientX - mouseDownPos.x,
              e.clientY - mouseDownPos.y,
            );

            // If it was a quick click and the mouse didn't move much, it's a selection
            if (clickDuration < 300 && moveDistance < 5) {
              const rect = renderer.domElement.getBoundingClientRect();
              mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
              mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

              raycaster.setFromCamera(mouse, camera);
              const intersects = raycaster.intersectObjects(
                scene.children,
                true,
              );

              if (intersects.length > 0) {
                // Find the first mesh in the intersection
                const firstMesh = intersects.find((i) =>
                  i.object.isMesh
                );
                if (firstMesh) {
                  // If we have filtered mesh meta, we should probably only focus on "selectable" items
                  // or just focus on whatever was clicked and let focusMesh handle if it's in the list
                  focusMesh(firstMesh.object.uuid);
                }
              }
            }
          };

          renderer.domElement.addEventListener(
            "pointerdown",
            handleMouseDown,
          );
          renderer.domElement.addEventListener(
            "pointerup",
            handleMouseUp,
          );

          // Animation Loop
          let animationId;
          const animate = () => {
            animationId = requestAnimationFrame(animate);

            const now = performance.now();
            const tracking = perfTrackingRef.current;

            // Frame time
            const frameTime = now - tracking.lastFrameTime;
            tracking.lastFrameTime = now;
            tracking.frameTimeHistory.push(frameTime);
            if (tracking.frameTimeHistory.length > 60) {
              tracking.frameTimeHistory.shift();
            }

            controls.update();
            renderer.render(scene, camera);

            // FPS Calculation
            tracking.frames++;
            if (now >= tracking.lastTime + 1000) {
              const fps = Math.round(
                (tracking.frames * 1000) / (now - tracking.lastTime),
              );

              tracking.fpsHistory.push(fps);
              if (tracking.fpsHistory.length > 10) {
                tracking.fpsHistory.shift();
              }

              const avgFps = tracking.fpsHistory.reduce((a, b) =>
                a + b, 0) /
                tracking.fpsHistory.length;
              const minFps = Math.min(...tracking.fpsHistory);
              const avgFrameTime =
                tracking.frameTimeHistory.reduce((a, b) => a + b, 0) /
                tracking.frameTimeHistory.length;

              setPerfStats((prev) => ({
                ...prev,
                fps,
                avgFps: Math.round(avgFps),
                minFps,
                frameTime: avgFrameTime.toFixed(1),
              }));

              tracking.frames = 0;
              tracking.lastTime = now;
            }
          };
          animate();

          return () => {
            window.removeEventListener("resize", handleResize);
            mediaQuery.removeEventListener("change", handleThemeChange);
            renderer.domElement.removeEventListener(
              "pointerdown",
              handleMouseDown,
            );
            renderer.domElement.removeEventListener(
              "pointerup",
              handleMouseUp,
            );
            mountRef.current?.removeChild(renderer.domElement);
          };
        }, []);

        // Performance Polling (Memory, Network, GPU)
        useEffect(() => {
          const interval = setInterval(() => {
            if (!showStats) return;

            let memory = { used: 0 };
            if (window.performance && window.performance.memory) {
              const mem = performance.memory;
              memory.used = mem.usedJSHeapSize
                ? Math.round(mem.usedJSHeapSize / 1048576)
                : 0;
            }

            // Network Info
            const resources = performance.getEntriesByType("resource");
            const totalBytes = resources.reduce(
              (acc, entry) =>
                acc +
                (entry.decodedBodySize || entry.transferSize || 0),
              0,
            );

            const modelEntry = [...resources]
              .reverse()
              .find((r) =>
                r.name.endsWith(".glb") || r.name.includes("model")
              );

            // Check if it's cached or was a small revalidation (304)
            const isCached = modelEntry
              ? (modelEntry.transferSize === 0 ||
                (modelEntry.transferSize < 2000 &&
                  modelEntry.duration < 50))
              : false;

            const network = {
              totalMB: (totalBytes / 1048576).toFixed(2),
              files: resources.length,
              modelSizeMB: modelEntry
                ? (modelEntry.decodedBodySize / 1048576).toFixed(2)
                : 0,
              modelTime: modelEntry
                ? Math.round(modelEntry.duration)
                : 0,
              isCached: isCached,
            };

            // GPU / Renderer Info
            let rendererInfo = {
              drawCalls: 0,
              triangles: 0,
              textures: 0,
              geometries: 0,
            };
            let gpuName = "Desconhecida";

            if (rendererRef.current) {
              const info = rendererRef.current.info;
              rendererInfo = {
                drawCalls: info.render.calls,
                triangles: info.render.triangles,
                textures: info.memory.textures,
                geometries: info.memory.geometries,
              };

              const gl = rendererRef.current.getContext();
              const debugInfo = gl.getExtension(
                "WEBGL_debug_renderer_info",
              );
              if (debugInfo) {
                gpuName = gl.getParameter(
                  debugInfo.UNMASKED_RENDERER_WEBGL,
                );
              }
            }

            setPerfStats((prev) => ({
              ...prev,
              memory,
              network: {
                ...prev.network,
                ...network,
              },
              gpu: {
                ...rendererInfo,
                name: gpuName,
              },
            }));

            // Sync with React Native if applicable
            sendMessageToRN("PERF_UPDATE", {
              fps: perfStats.fps,
              memory,
              network,
              gpu: rendererInfo,
            });
          }, 2000);

          return () => clearInterval(interval);
        }, [showStats, perfStats.fps]);

        // Listen for messages FROM React Native
        useEffect(() => {
          const handleMessage = (event) => {
            try {
              const message = JSON.parse(event.data);
              console.log("[Bridge] Received from RN:", message);

              switch (message.type) {
                case "FOCUS_MESH":
                  if (message.uuid) focusMesh(message.uuid);
                  break;
                case "RESET_VIEW":
                  resetView();
                  break;
                case "TOGGLE_GRID":
                  setShowGrid(!!message.value);
                  break;
                case "TOGGLE_STATS":
                  setShowStats(!!message.value);
                  break;
                case "TOGGLE_MESH_LIST":
                  setShowMeshList(!!message.value);
                  break;
              }
            } catch (e) {
              // Not a JSON message or not for us
            }
          };

          window.addEventListener("message", handleMessage);
          document.addEventListener("message", handleMessage); // For some Android versions

          return () => {
            window.removeEventListener("message", handleMessage);
            document.removeEventListener("message", handleMessage);
          };
        }, [meshes]); // Re-bind when meshes change to ensure focusMesh works with current state

        // Load specific model on mount
        const MODEL_PATHS = {
          desktop: "public/models/desktop/fast-dungeon_warkarma.glb",
          mobile: "public/models/mobile/fast-dungeon_warkarma.glb",
        };

        useEffect(() => {
          const isMobile =
            window.matchMedia("(max-width: 768px)").matches;

          const targetPath = isMobile
            ? MODEL_PATHS.mobile
            : MODEL_PATHS.desktop;
          console.log(
            `[Device Detection] Loading ${
              isMobile ? "Mobile" : "Desktop"
            } model: ${targetPath}`,
          );

          loadModel(targetPath);
        }, []);

        useEffect(() => {
          if (window._toggleGrid) {
            window._toggleGrid(showGrid);
          }
        }, [showGrid]);

        const loadModel = (fileOrUrl) => {
          const isUrl = typeof fileOrUrl === "string";

          if (
            !isUrl &&
            (!fileOrUrl ||
              !fileOrUrl.name.toLowerCase().endsWith(".glb"))
          ) {
            alert("Por favor, selecione um arquivo .glb válido");
            return;
          }

          setIsLoading(true);
          sendMessageToRN("LOAD_START", {
            filename: isUrl
              ? fileOrUrl.split("/").pop()
              : fileOrUrl.name,
          });
          setFilename(
            isUrl ? fileOrUrl.split("/").pop() : fileOrUrl.name,
          );

          // Clear previous model and free memory
          if (modelRef.current) {
            modelRef.current.traverse((node) => {
              if (node.isMesh) {
                node.geometry.dispose();
                if (Array.isArray(node.material)) {
                  node.material.forEach((m) => m.dispose());
                } else {
                  node.material.dispose();
                }
              }
            });
            sceneRef.current.remove(modelRef.current);
          }

          const loader = new GLTFLoader();

          // DRACO
          const dracoLoader = new DRACOLoader();
          dracoLoader.setDecoderPath(
            "https://www.gstatic.com/draco/versioned/decoders/1.5.6/",
          );
          loader.setDRACOLoader(dracoLoader);

          // KTX2
          const ktx2Loader = new KTX2Loader();
          ktx2Loader.setTranscoderPath(
            "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/",
          );
          ktx2Loader.detectSupport(rendererRef.current);
          loader.setKTX2Loader(ktx2Loader);

          // Meshopt
          loader.setMeshoptDecoder(MeshoptDecoder);

          const handleGLTF = (gltf) => {
            const model = gltf.scene;

            // Center model
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            model.position.x += model.position.x - center.x;
            model.position.y += model.position.y - center.y;
            model.position.z += model.position.z - center.z;

            // Adjust position so it sits on the floor
            model.position.y += size.y / 2;

            const filteredMeshMeta = {
              Column004_Wall_Dark_Blue_0: {
                name: "Entrada da Dungeon",
                description: "Área inicial de acesso à dungeon.",
              },
              Column009_Wall_Dark_Blue_0: {
                name: "2ª Parte da Dungeon",
                description:
                  "Uma reta principal que leva diretamente à Sala do Chefão.",
              },
              Boss_Skull_0: {
                name: "Chefe da Dungeon",
                description:
                  "Grande salão cerimonial onde reside o guardião esquelético da dungeon.",
              },
              P_Treasure_Tile_Border_0: {
                name: "Tesouro Final da Dungeon",
                description:
                  "Câmara guardada que contém as relíquias mais valiosas.",
              },
            };

            const meshList = [];
            const seenByName = new Set();

            // Safe check: set metaData to null if filteredMeshMeta is not defined
            let metaData = null;
            try {
              metaData = filteredMeshMeta;
            } catch (e) {
              // Variable doesn't exist or was renamed (fallback will be triggered)
            }

            const isFilterActive = metaData &&
              Object.keys(metaData).length > 0;

            let vertices = 0;
            let faces = 0;

            model.traverse((node) => {
              if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;

                // Model Stats
                const geometry = node.geometry;
                if (geometry.attributes.position) {
                  vertices += geometry.attributes.position.count;
                  if (geometry.index) {
                    faces += geometry.index.count / 3;
                  } else {
                    faces += geometry.attributes.position.count / 3;
                  }
                }

                const meta = isFilterActive
                  ? metaData[node.name]
                  : null;

                if (meta) {
                  if (!seenByName.has(node.name)) {
                    seenByName.add(node.name);
                    meshList.push({
                      key: node.name,
                      name: meta.name,
                      description: meta.description,
                      uuid: node.uuid,
                    });
                  }
                } else if (!isFilterActive) {
                  // Fallback: If no filter is active, add the mesh with its original name
                  meshList.push({
                    name: node.name ||
                      `Desconhecido (${node.uuid.substring(0, 4)})`,
                    uuid: node.uuid,
                    description: "Sem descrição disponível.",
                  });
                }
              }
            });

            sceneRef.current.add(model);
            modelRef.current = model;

            // Update camera position to see the model
            const maxDim = Math.max(size.x, size.y, size.z);
            cameraRef.current.position.set(
              maxDim * 1.5,
              maxDim * 1.5,
              maxDim * 1.5,
            );
            controlsRef.current.target.set(0, size.y / 2, 0);

            const loadTime =
              ((performance.now() - perfTrackingRef.current.startTime) /
                1000).toFixed(2);

            setPerfStats((prev) => ({
              ...prev,
              loadTime,
              modelSize: { vertices, faces },
            }));

            setMeshes(meshList);
            console.log("Mesh list (menu entries):", meshList);
            setIsLoading(false);
            sendMessageToRN("LOAD_COMPLETE", {
              meshCount: meshList.length,
              vertices,
              faces,
              loadTime,
            });
          };

          const handleError = (err) => {
            console.error(err);
            alert("Erro ao carregar o modelo");
            setIsLoading(false);
            sendMessageToRN("LOAD_ERROR", { error: err.message });
          };

          if (isUrl) {
            loader.load(fileOrUrl, handleGLTF, undefined, handleError);
          } else {
            const reader = new FileReader();
            reader.readAsArrayBuffer(fileOrUrl);
            reader.onload = (e) => {
              loader.parse(
                e.target.result,
                "",
                handleGLTF,
                handleError,
              );
            };
          }
        };

        const onDrop = (e) => {
          e.preventDefault();
          setIsDragging(false);
          const file = e.dataTransfer.files[0];
          loadModel(file);
        };

        const onDragOver = (e) => {
          e.preventDefault();
          setIsDragging(true);
        };

        const onFileSelect = (e) => {
          const file = e.target.files[0];
          loadModel(file);
        };

        const focusMesh = (uuid) => {
          if (!modelRef.current) return;

          const object = modelRef.current.getObjectByProperty(
            "uuid",
            uuid,
          );
          if (object) {
            const box = new THREE.Box3().setFromObject(object);
            const center = new THREE.Vector3();
            box.getCenter(center);
            const size = new THREE.Vector3();
            box.getSize(size);

            // Calculate maximum dimension for focus zoom
            const maxDim = Math.max(size.x, size.y, size.z);

            // Calculate new camera position (front view)
            const offset = new THREE.Vector3(
              0,
              maxDim * 0.6,
              maxDim * 2.2,
            );

            const newPos = center.clone().add(offset);

            // Set new state
            cameraRef.current.position.copy(newPos);
            controlsRef.current.target.copy(center);
            controlsRef.current.update();

            // Update focused metadata
            const clicked = meshes.find((x) => x.uuid === uuid);
            if (clicked) {
              setFocusedInfo({
                name: clicked.name,
                description: clicked.description,
              });
              sendMessageToRN("MESH_FOCUSED", {
                uuid,
                name: clicked.name,
                description: clicked.description,
              });
            } else {
              // If it's a mesh not in our metadata list, we can still show its internal name
              setFocusedInfo({
                name: object.name || "Objeto Desconhecido",
                description:
                  "Este objeto não possui uma descrição detalhada.",
              });
            }

            // Flash highlight effect (briefly)
            const originalHex = [];
            object.traverse((node) => {
              if (node.isMesh && node.material) {
                const materials = Array.isArray(node.material)
                  ? node.material
                  : [node.material];
                materials.forEach((m) => {
                  if (m.emissive) {
                    originalHex.push({
                      mat: m,
                      color: m.emissive.getHex(),
                    });
                    m.emissive.setHex(0xe61e25);
                  }
                });
              }
            });

            setTimeout(() => {
              originalHex.forEach((item) => {
                item.mat.emissive.setHex(item.color);
              });
            }, 500);
          }
        };

        const resetView = () => {
          if (!modelRef.current) return;
          const box = new THREE.Box3().setFromObject(modelRef.current);
          const center = new THREE.Vector3();
          box.getCenter(center);
          const size = new THREE.Vector3();
          box.getSize(size);

          // Calculate maximum dimension for camera distance
          const maxDim = Math.max(size.x, size.y, size.z);
          cameraRef.current.position.set(
            maxDim * 1.5,
            maxDim * 1.5,
            maxDim * 1.5,
          );
          controlsRef.current.target.copy(center);
          controlsRef.current.update();
        };

        const takeScreenshot = () => {
          if (
            !rendererRef.current || !sceneRef.current ||
            !cameraRef.current
          ) {
            return;
          }

          // Render one frame for the screenshot
          rendererRef.current.render(
            sceneRef.current,
            cameraRef.current,
          );

          const link = document.createElement("a");
          link.setAttribute("download", `${filename || "model"}.png`);
          link.setAttribute(
            "href",
            rendererRef.current.domElement
              .toDataURL("image/png")
              .replace("image/png", "image/octet-stream"),
          );
          link.click();
        };

        return html`
          <div
            onDrop="${onDrop}"
            onDragOver="${onDragOver}"
            onDragLeave="${() => setIsDragging(false)}"
            style="width: 100%; height: 100%;"
          >
            <div ref="${mountRef}" id="canvas-container"></div>

            <div class="overlay">
              <div class="header">
                <div class="title-container">
                  <h1>GLB Viewer</h1>
                  <p style="color: var(--text-muted); font-size: 0.8rem;">
                    ${filename || "Nenhum arquivo carregado"}
                  </p>
                </div>
              </div>

              ${showStats &&
                html`
                  <div class="perf-overlay">
                    <!-- Rendering Section -->
                    <div class="perf-section">
                      <div class="perf-section-title">Renderização</div>
                      <div class="perf-item">
                        <span class="perf-label">FPS</span>
                        <span
                          class="perf-value ${perfStats.fps >= 50
                            ? "good"
                            : perfStats.fps >= 30
                            ? "warning"
                            : "critical"}"
                        >
                          ${perfStats.fps}
                        </span>
                      </div>
                      <div class="perf-item">
                        <span class="perf-label">FPS Médio / Mín</span>
                        <span class="perf-value">
                          ${perfStats.avgFps} / ${perfStats.minFps}
                        </span>
                      </div>
                      <div class="perf-item">
                        <span class="perf-label">Frame Time</span>
                        <span class="perf-value">${perfStats
                          .frameTime}ms</span>
                      </div>
                    </div>

                    <!-- Memory Section -->
                    <div class="perf-section">
                      <div class="perf-section-title">Memória JS</div>
                      <div class="perf-item">
                        <span class="perf-label">Uso</span>
                        <span class="perf-value">
                          ${perfStats.memory.used}MB
                        </span>
                      </div>
                    </div>

                    <!-- Scene Section -->
                    <div class="perf-section">
                      <div class="perf-section-title">Cena</div>
                      <div class="perf-item">
                        <span class="perf-label">Draw Calls</span>
                        <span
                          class="perf-value ${perfStats.gpu.drawCalls >
                              300
                            ? "critical"
                            : perfStats.gpu.drawCalls > 150
                            ? "warning"
                            : "good"}"
                        >
                          ${perfStats.gpu.drawCalls}
                        </span>
                      </div>
                      <div class="perf-item">
                        <span class="perf-label">Triângulos</span>
                        <span class="perf-value">
                          ${(perfStats.gpu.triangles / 1000).toFixed(
                            1,
                          )}k
                        </span>
                      </div>
                      <div class="perf-item">
                        <span class="perf-label">Texturas / Geometrias</span>
                        <span class="perf-value">
                          ${perfStats.gpu.textures} / ${perfStats.gpu
                            .geometries}
                        </span>
                      </div>
                    </div>

                    <!-- Model & Network Section -->
                    <div class="perf-section">
                      <div class="perf-section-title">Modelo & Rede</div>
                      ${perfStats.modelSize.vertices > 0 &&
                        html`
                          <div class="perf-item">
                            <span class="perf-label">Vértices / Faces</span>
                            <span class="perf-value">
                              ${(perfStats.modelSize.vertices / 1000)
                                .toFixed(
                                  1,
                                )}k / ${(perfStats.modelSize.faces /
                                  1000).toFixed(1)}k
                            </span>
                          </div>
                        `}
                      <div class="perf-item">
                        <span class="perf-label">Origem</span>
                        <span class="perf-value">
                          ${perfStats.network.isCached
                            ? html`
                              <span class="good">Cache</span>
                            `
                            : html`
                              Rede (${perfStats.network.modelTime}ms)
                            `}
                        </span>
                      </div>
                      <div class="perf-item">
                        <span class="perf-label">Tamanho GLB</span>
                        <span class="perf-value">${perfStats.network
                          .modelSizeMB}MB</span>
                      </div>
                      <div class="perf-item">
                        <span class="perf-label">Total Transferido</span>
                        <span class="perf-value">${perfStats.network
                          .totalMB}MB (${perfStats.network
                          .files} arq)</span>
                      </div>
                      <div class="perf-item">
                        <span class="perf-label">Tempo Load</span>
                        <span class="perf-value">${perfStats
                          .loadTime}s</span>
                      </div>
                    </div>

                    <!-- GPU Section -->
                    <div class="perf-section">
                      <div class="perf-section-title">GPU</div>
                      <div
                        class="perf-item"
                        style="align-items: flex-start; flex-direction: column; gap: 4px;"
                      >
                        <span
                          class="perf-value"
                          style="font-size: 0.65rem; line-height: 1.3; word-break: break-word; font-family: sans-serif;"
                        >
                          ${perfStats.gpu.name}
                        </span>
                      </div>
                    </div>
                  </div>
                `} ${meshes.length > 0 &&
                showMeshList &&
                html`
                  <div
                    class="mesh-modal-backdrop"
                    onClick="${() => setShowMeshList(false)}"
                  >
                    <div
                      class="mesh-modal"
                      onClick="${(e) => e.stopPropagation()}"
                    >
                      <div class="mesh-modal-header">
                        <h4>Objetos na Cena (${meshes.length})</h4>
                        <button
                          class="mesh-modal-close"
                          onClick="${() => setShowMeshList(false)}"
                        >
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                          </svg>
                        </button>
                      </div>
                      <div class="mesh-modal-content">
                        ${meshes.map(
                          (m) =>
                            html`
                              <div
                                class="mesh-item"
                                key="${m.uuid}"
                                title="Clique para focar em ${m.name}"
                                onClick="${() => {
                                  focusMesh(m.uuid);
                                  setShowMeshList(false);
                                }}"
                              >
                                ${m.name}
                              </div>
                            `,
                        )}
                      </div>
                    </div>
                  </div>
                `} ${isLoading &&
                html`
                  <div class="loader-info">
                    <div class="spinner"></div>
                    <span>Carregando modelo...</span>
                  </div>
                `} ${focusedInfo &&
                html`
                  <div class="focused-info-panel">
                    <div style="display:flex; align-items:flex-start; gap:10px;">
                      <div style="flex:1; min-width: 0;">
                        <div
                          style="font-weight:600; margin-bottom:6px; overflow-wrap: break-word;"
                        >
                          ${focusedInfo.name}
                        </div>
                        <div
                          style="font-size:0.9rem; color:var(--text-muted); line-height:1.35;"
                        >
                          ${focusedInfo.description}
                        </div>
                      </div>
                      <button
                        class="mesh-modal-close"
                        onClick="${() => setFocusedInfo(null)}"
                        title="Fechar"
                        style="margin-left:6px;"
                      >
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <line x1="18" y1="6" x2="6" y2="18" />
                          <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                      </button>
                    </div>
                  </div>
                `}

              <div class="hub-panel">
                <a
                  href="index.html"
                  class="hub-btn"
                  data-tooltip="Voltar ao Menu"
                  style="text-decoration: none;"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                  </svg>
                </a>
                <button
                  class="hub-btn"
                  data-tooltip="Centralizar Câmera"
                  onClick="${resetView}"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <circle cx="12" cy="12" r="6" />
                    <circle cx="12" cy="12" r="2" />
                  </svg>
                </button>
                <button
                  class="hub-btn ${showGrid ? "active" : ""}"
                  data-tooltip="Grelha de Chão"
                  onClick="${() => setShowGrid(!showGrid)}"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <line x1="3" y1="9" x2="21" y2="9" />
                    <line x1="3" y1="15" x2="21" y2="15" />
                    <line x1="9" y1="3" x2="9" y2="21" />
                    <line x1="15" y1="3" x2="15" y2="21" />
                  </svg>
                </button>
                <button
                  class="hub-btn ${showMeshList ? "active" : ""}"
                  data-tooltip="Objetos na Cena"
                  onClick="${() => setShowMeshList(!showMeshList)}"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <line x1="9" y1="3" x2="9" y2="21" />
                  </svg>
                </button>
                <button
                  class="hub-btn ${showStats ? "active" : ""}"
                  data-tooltip="Desempenho (FPS)"
                  onClick="${() => setShowStats(!showStats)}"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                  </svg>
                </button>
                <button
                  class="hub-btn"
                  data-tooltip="Capturar Foto"
                  onClick="${takeScreenshot}"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                    />
                    <circle cx="12" cy="13" r="4" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      render(h(App), document.getElementById("app"));
    </script>
  </body>
</html>
